{# Menú desplegable de un módulo. Parámetros: slug, etiqueta, icono, listar, nuevo #}
{% with actual=request.resolver_match.kwargs.slug accion=request.resolver_match.url_name %}
<a class="nav-link {% if actual == slug %}active{% endif %}" data-bs-toggle="collapse" href="#menu-{{ slug }}"
  role="button" aria-expanded="{% if actual == slug %}true{% else %}false{% endif %}" aria-controls="menu-{{ slug }}">
  {{ icono }} &nbsp; {{ etiqueta }} <span class="flecha">⌄</span>
</a>
<div class="collapse {% if actual == slug %}show{% endif %}" id="menu-{{ slug }}">
  <div class="submenu">
    <a href="{% url 'lista' slug %}" class="{% if actual == slug and accion != 'crear' %}active{% endif %}">{{ listar
      }}</a>
    <a href="{% url 'crear' slug %}" class="{% if actual == slug and accion == 'crear' %}active{% endif %}">{{ nuevo
      }}</a>
  </div>
</div>
{% endwith %}
